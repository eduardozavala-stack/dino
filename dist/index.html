*{box-sizing:border-box}body{--accent:#535353;margin:0;background:#fff;color:#535353;font-family:Arial,sans-serif;transition:background 1.5s,color 1.5s}main{width:min(820px,100%);margin:clamp(60px,18vh,170px) auto 0;padding:0 24px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;outline-offset:8px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}h1{font-size:14px;letter-spacing:3px;font-weight:600;margin:0}h1 span{opacity:.5;font-weight:400;letter-spacing:2px}button{color:inherit;background:none;border:1px solid currentColor;border-radius:4px;padding:9px 12px;font:14px monospace;cursor:pointer}button:hover:enabled{background:color-mix(in srgb,currentColor 10%,transparent)}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.hud{display:flex;align-items:center;justify-content:space-between;gap:16px;font:13px monospace;margin-bottom:18px}.charge{width:145px;text-align:right;color:var(--accent)}.meter{height:3px;background:color-mix(in srgb,currentColor 20%,transparent);margin-top:8px}#dash-fill{height:100%;background:var(--accent);width:100%}.help{text-align:center;font-size:14px;line-height:1.9;margin-top:24px}.help p{margin:6px 0}.secondary{opacity:.7}kbd{font:12px monospace;border:1px solid currentColor;border-bottom-width:2px;border-radius:3px;padding:3px 6px}.controls{display:flex;justify-content:center;gap:12px;margin-top:22px}.controls button{min-width:100px;min-height:48px;touch-action:none}#dash{border-color:var(--accent);color:var(--accent);font-weight:bold}.legend{font-size:13px;opacity:.7;max-width:540px;margin:18px auto 0;text-align:center;line-height:1.7}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(pointer:coarse){.desktop{display:none}}@media(max-width:450px){main{padding:0 16px;margin-top:12vh}.controls{gap:8px}.controls button{min-width:0;flex:1;padding:10px 6px}.h </style></head><body><main><header><h1>DINO RUN <span>/ RIFT</span></h1><button id="pause" aria-label="Pausar partida">Ⅱ Pausa</button></header><div class="hud"><span id="zone">01 / DESIERTO</span><div class="charge"><span id="dash-text">DASH LISTO</span><div class="meter"><div id="dash-fill"></div></div></div></div><canvas id="game" width="640" height="210" tabindex="0" role="img" aria-label="Espacio o arriba para saltar o nadar, abajo para bajar, X o Shift para DASH."></canvas><div class="help"><p id="hint">Presiona espacio o toca el juego para empezar</p><p class="desktop secondary"><kbd>ESPACIO</kbd> / <kbd>↑</kbd> saltar o nadar &nbsp; <kbd>↓</kbd> bajar<br><kbd>X</kbd> / <kbd>SHIFT</kbd> DASH &nbsp; <kbd>P</kbd> pausa</p></div><div class="controls"><button id="duck">↓ Bajar</button><button id="jump">↑ Saltar / nadar</button><button id="dash" disabled>⚡ DASH</button></div><p class="legend">DASH: avance rápido e invulnerabilidad breve. Recarga: 3,5 s.<br>Nueva zona cada 20 s. La barra inferior marca tu progreso.</p><p id="status" class="sr" aria-live="polite"></p></main><script src="game.js"></script></body></html>
